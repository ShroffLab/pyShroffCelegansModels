[workspace]
authors = ["Mark Kittisopikul <kittisopikulm@janelia.hhmi.org>"]
channels = ["conda-forge"]
description = "C. elegans worm space coordinate transformations"
name = "celegans-model"
platforms = ["linux-64", "win-64", "osx-arm64"]
version = "0.1.0"

[tasks]
test = "pytest tests/ -v"
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
typecheck = "mypy src/"

# Core dependencies (always required)
[dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.20"
pytest = ">=9.0.3,<10"
toml = "*"

# Feature: Julia backend
[feature.julia.dependencies]
pyjuliacall = ">=0.9.24,<0.10"
pyjuliapkg = ">=0.1.16,<0.2"

[feature.julia.tasks]
setup_julia_env = "python setup_julia_env.py"

# Feature: Python/scipy backend
[feature.python.dependencies]
scipy = ">=1.10"
pandas = ">=2.0"
zarr = ">=2.14"

# Feature: Development tools
[feature.dev.dependencies]
ipython = "*"
matplotlib = ">=3.7"
ruff = ">=0.1"
mypy = ">=1.0"

[environments]
# Default: Python implementation
default = { features = ["python"], solve-group = "default" }
# Julia implementation
julia = { features = ["julia"], solve-group = "julia" }
# Annotation tools (napari viewer + lineage)
annotator = { features = ["python", "annotator"], solve-group = "annotator" }
# Full development environment
dev = { features = ["python", "julia", "dev"], solve-group = "dev" }

# Feature: Annotation tools (napari viewer + lineage)
[feature.annotator.dependencies]
networkx = ">=3.0"
magicgui = ">=0.10.1"
qtpy = ">=2.4"
natsort = ">=8.4"
numcodecs = ">=0.13,<0.16"

[feature.annotator.pypi-dependencies]
napari = ">=0.6.2,<0.7.0"
funtracks = ">=2,<3"
motile-tracker = ">=5,<6"
pyqt5 = ">=5.15"

[pypi-dependencies]
celegans-model = { path = ".", editable = true }
